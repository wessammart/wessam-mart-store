<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>وسام مارت</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#fff;min-height:100vh}
:root{--primary:#3b82f6;--primary-light:#60a5fa;--bg:#0f172a;--card:#1e293b;--muted:#94a3b8;--border:#334155;--success:#22c55e;--danger:#ef4444}
input,select,textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:#fff;font-size:14px}
button{cursor:pointer;font-weight:bold;border:none;border-radius:8px;padding:10px 20px;font-size:14px;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;width:100%;display:block;text-align:center}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-sm{font-size:12px;padding:6px 12px;width:auto!important}
img{max-width:100%;border-radius:8px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.page{display:none;padding:16px;max-width:800px;margin:auto;min-height:100vh}
.page.active{display:block}
header{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header h1{font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .icons{display:flex;gap:12px;align-items:center}
header .icons button{font-size:20px;background:none;padding:4px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;padding:2px 5px;border-radius:10px}
.hero{text-align:center;padding:30px 0;background:linear-gradient(135deg,var(--card),var(--bg));border-radius:16px;margin-bottom:16px}
.hero h2{font-size:28px;margin-bottom:8px}
.hero p{color:var(--muted)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cat-card{background:var(--card);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.cat-card:active{transform:scale(.97)}
.cat-card .emoji{font-size:32px;margin-bottom:8px}
.cat-card .name{font-weight:bold;font-size:15px}
.cat-card .desc{font-size:11px;color:var(--muted);margin-top:4px}
.cat-card .overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.cat-card .overlay span{background:var(--yellow);color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod-card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer}
.prod-card img{width:100%;height:140px;object-fit:cover}
.prod-card .info{padding:10px}
.prod-card .info .name{font-weight:bold;font-size:13px;margin-bottom:4px}
.prod-card .info .price{color:var(--primary);font-size:14px;font-weight:bold}
.prod-card .info .out{color:var(--danger);font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;overflow-y:auto;padding:20px}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal-content{background:var(--card);border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-content h2{font-size:20px;margin-bottom:12px}
.back-btn{background:none;font-size:24px;padding:4px;margin-bottom:12px;display:inline-block}
.cart-item{display:flex;gap:10px;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:8px}
.cart-item img{width:50px;height:50px;object-fit:cover;border-radius:6px}
.cart-item .info{flex:1}
.cart-item .info .name{font-weight:bold;font-size:13px}
.cart-item .info .price{color:var(--primary);font-size:12px}
.cart-item .qty{display:flex;gap:6px;align-items:center}
.cart-item .qty button{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px}
.opt-btn{padding:6px 12px;border-radius:20px;background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer;margin:4px}
.opt-btn.active{background:var(--primary);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);padding:12px 24px;border-radius:10px;z-index:300;display:none;font-size:14px}
.toast.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(min-width:600px){.cat-grid{grid-template-columns:1fr 1fr 1fr}.prod-grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head><body>

<header>
  <h1 id="pageTitle">وسام مارت</h1>
  <div class="icons">
    <button onclick="toggleCart()" style="position:relative">🛒<span class="badge" id="cartBadge" style="display:none">0</span></button>
    <button onclick="toggleAuth()">👤</button>
    <button onclick="location.reload()">🔄</button>
  </div>
</header>

<!-- ====== Home ====== -->
<div class="page active" id="pageHome">
  <div class="hero"><h2>أهلاً بك في وسام مارت</h2><p>كل ما تحتاجه في مكان واحد</p></div>
  <div class="cat-grid" id="catGrid"></div>
</div>

<!-- ====== Products ====== -->
<div class="page" id="pageProducts">
  <button class="back-btn" onclick="goHome()">←</button>
  <h2 id="storeTitle" style="margin-bottom:12px"></h2>
  <div class="prod-grid" id="prodGrid"></div>
</div>

<!-- ====== Product Detail ====== -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- ====== Cart ====== -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <h2>🛒 سلة المشتريات</h2>
    <div id="cartItems"></div>
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
      <p style="margin-bottom:8px">الإجمالي: <span id="cartTotal" style="color:var(--primary);font-weight:bold">0 ريال</span></p>
      <button class="btn-primary" onclick="checkout()" id="checkoutBtn">إتمام الطلب</button>
    </div>
  </div>
</div>

<!-- ====== Auth Modal ====== -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <input id="authName" placeholder="الاسم"><input id="authPhone" placeholder="رقم الجوال">
    <input id="authPass" type="password" placeholder="كلمة المرور (8 أحرف+)">
    <button class="btn-primary" onclick="doAuth()" id="authBtn" style="margin-top:8px">تسجيل الدخول</button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px">إذا ما عندك حساب، يسجل تلقائياً</p>
  </div>
</div>

<!-- ====== Checkout ====== -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <h2>📋 تأكيد الطلب</h2>
    <input id="coAddress" placeholder="العنوان"><input id="coNotes" placeholder="ملاحظات (اختياري)">
    <div style="margin:12px 0">
      <p style="font-size:13px;color:var(--muted);margin-bottom:8px">طريقة الدفع:</p>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:14px"><input type="radio" name="pm" value="cash" checked> دفع عند الاستلام</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="radio" name="pm" value="transfer"> تحويل بنكي</label>
    </div>
    <div id="bankInfo" style="display:none;font-size:13px;color:var(--muted);margin-bottom:8px">حسب ما تحدده الإدارة</div>
    <p style="margin-bottom:8px">الإجمالي: <span id="coTotal" style="color:var(--primary);font-weight:bold"></span></p>
    <button class="btn-primary" onclick="placeOrder()">تأكيد الطلب</button>
  </div>
</div>

<!-- ====== Toast ====== -->
<div class="toast" id="toast"></div>

<script>
// ==================== REST API ====================
const PID='wessam2',KEY='AIzaSyBGM-ORvTV4juxPfiA8Mb7Vb25_0EQchEY';
const BASE=`https://firestore.googleapis.com/v1/projects/${PID}/databases/(default)/documents`;

async function api(method,path,body){
  const opt={method,headers:{}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({fields:getFields(body)})}
  if(path.includes('?'))path+='&key='+KEY;else path+='?key='+KEY;
  const r=await fetch(BASE+'/'+path,opt);
  if(r.status===429)throw new Error('الحد مسموح تجاوز، حاول بعد دقيقة');
  const d=await r.json();if(d.error)throw new Error(d.error.message);return d;
}
function getFields(o){const f={};for(const[k,v]of(Object.entries(o||{}))){if(v===null||v===undefined)f[k]={nullValue:null};
else if(typeof v==='string')f[k]={stringValue:v};else if(typeof v==='boolean')f[k]={booleanValue:v};
else if(typeof v==='number')f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(x=>({stringValue:String(x)}))}};
else f[k]={stringValue:String(v)}}return f;}
function docs(r){(r.documents||[]).map(d=>{const o={id:d.name.split('/').pop()};const ff=d.fields||{};for(const[k,v]of Object.entries(ff)){
if(v.stringValue!==undefined)o[k]=v.stringValue;else if(v.booleanValue!==undefined)o[k]=v.booleanValue;
else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.doubleValue!==undefined)o[k]=v.doubleValue;
else if(v.arrayValue)o[k]=v.arrayValue.values?v.arrayValue.values.map(x=>x.stringValue):[];else o[k]=null}return o})}
async function apiGet(path){return api('GET',path)}
async function apiAdd(col,data){return api('POST',col,data)}

// ==================== Data ====================
let products=[],categories=[],customCats=[],deliveryFee=10;
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let user=null,currentStore=null;

async function loadProducts(){
  try{const r=await apiGet('products');products=docs(r);renderHome()}catch(e){}
}
async function loadCustomCats(){
  try{const r=await apiGet('customCategories');customCats=docs(r);renderHome()}catch(e){}
}
async function loadSettings(){
  try{const r=await apiGet('settings/delivery');if(r.fields){const v=r.fields.fee?.integerValue||r.fields.fee?.doubleValue;if(v)deliveryFee=Number(v)}}catch(e){}
}
loadProducts();loadCustomCats();loadSettings();
updateCart();

// ==================== Home ====================
const defaultCats=[
  {id:'market',name:'البقالات',emoji:'🛒',desc:'مشروبات وألبان ومقاضي'},
  {id:'restaurant',name:'المطاعم',emoji:'🍔',desc:'وجبات سريعة وشهية'},
  {id:'coffee',name:'كوفي',emoji:'☕',desc:'اختر كوفيك المفضل'},
  {id:'coffeeMudhal',name:'كوفي مدهال',emoji:'☕',desc:'قهوة مدهال المميزة'},
  {id:'veggies',name:'خضار وفواكه',emoji:'🥦',desc:'طازجة يومياً'},
  {id:'homemade',name:'إسر منتجات',emoji:'🏠',desc:'أكلات بيتية جاهزة'}
];

function renderHome(){
  const el=document.getElementById('catGrid');
  let all=[...defaultCats,...customCats.map(c=>({id:c.id,name:c.name,emoji:c.emoji||'📦',desc:c.desc||'',custom:true}))];
  el.innerHTML=all.map(c=>`<div class="cat-card" onclick="openStore('${c.id}')"><div class="emoji">${c.emoji}</div><div class="name">${c.name}</div><div class="desc">${c.desc}</div></div>`).join('');
}

function openStore(id){
  currentStore=id;const c=[...defaultCats,...customCats].find(x=>x.id===id);
  document.getElementById('pageHome').classList.remove('active');
  document.getElementById('pageProducts').classList.add('active');
  document.getElementById('storeTitle').textContent=c?c.name:currentStore;
  renderProducts();
}

function goHome(){currentStore=null;document.getElementById('pageProducts').classList.remove('active');document.getElementById('pageHome').classList.add('active');document.getElementById('pageTitle').textContent='وسام مارت'}

// ==================== Products ====================
function renderProducts(){
  const el=document.getElementById('prodGrid');
  const filtered=products.filter(p=>p.storeType===currentStore);
  if(!filtered.length){el.innerHTML='<p style="color:var(--muted);text-align:center;grid-column:span 2">لا توجد منتجات في هذا القسم</p>';return}
  el.innerHTML=filtered.map(p=>`<div class="prod-card" onclick="openDetail('${p.id}')">
    <img src="${p.image||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'">
    <div class="info"><div class="name">${p.name}</div><div class="price">${p.price}</div></div></div>`).join('');
}

// ==================== Detail ====================
function openDetail(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  let optHtml='';if(p.options&&p.options.length){optHtml=`<div style="margin:12px 0"><p style="font-size:13px;color:var(--muted);margin-bottom:6px">اختر الخيار:</p><div id="optContainer">${p.options.map(o=>`<span class="opt-btn" onclick="selectOpt(this,'${o}')">${o}</span>`).join('')}</div></div>`}
  document.getElementById('detailContent').innerHTML=`
    <img src="${p.image||'https://via.placeholder.com/400'}" style="max-height:300px;width:100%;object-fit:contain;margin-bottom:12px">
    <h2 style="font-size:22px;margin-bottom:4px">${p.name}</h2>
    <p style="color:var(--primary);font-size:20px;font-weight:bold;margin-bottom:12px">${p.price}</p>
    ${optHtml}
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button onclick="qty(-1)" style="width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:18px">-</button><span id="dqty" style="font-size:18px;font-weight:bold">1</span><button onclick="qty(1)" style="width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:18px">+</button></div>
    <button class="btn-primary" onclick="addToCart('${p.id}')">أضف للسلة</button>`;
  document.getElementById('detailModal').classList.add('open');
  window._detailId=p.id;window._detailQty=1;window._detailOpt=null;
}
function selectOpt(el,v){el.parentElement.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');window._detailOpt=v}
function qty(c){window._detailQty=Math.max(1,(window._detailQty||1)+c);document.getElementById('dqty').textContent=window._detailQty}
function closeDetail(){document.getElementById('detailModal').classList.remove('open')}

// ==================== Cart ====================
function addToCart(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const opt=window._detailOpt||null;const cartId=id+(opt?'_'+opt:'');
  const ex=cart.find(i=>i.cartId===cartId);
  if(ex){ex.qty+=window._detailQty||1}else{cart.push({...p,cartId,qty:window._detailQty||1,selectedOption:opt})}
  updateCart();closeDetail();toast('تمت الإضافة للسلة');
}
function updateCart(){
  const t=cart.reduce((s,i)=>s+i.qty,0);const b=document.getElementById('cartBadge');
  if(t){b.textContent=t;b.style.display='block'}else{b.style.display='none'}
  localStorage.setItem('cart',JSON.stringify(cart));
}
function toggleCart(){
  const el=document.getElementById('cartModal');el.classList.toggle('open');
  if(el.classList.contains('open'))renderCart();
}
function renderCart(){
  const el=document.getElementById('cartItems');
  if(!cart.length){el.innerHTML='<p style="color:var(--muted);text-align:center">السلة فارغة</p>';document.getElementById('checkoutBtn').disabled=true;document.getElementById('cartTotal').textContent='0 ريال';return}
  el.innerHTML=cart.map(i=>`<div class="cart-item">
    <img src="${i.image||'https://via.placeholder.com/50'}">
    <div class="info"><div class="name">${i.name}${i.selectedOption?` <span style="color:var(--primary);font-size:11px">(${i.selectedOption})</span>`:''}</div><div class="price">${i.price}</div></div>
    <div class="qty"><button onclick="cartQty('${i.cartId}',-1)">-</button><span style="font-weight:bold">${i.qty}</span><button onclick="cartQty('${i.cartId}',1)">+</button></div>
  </div>`).join('');
  const sub=cart.reduce((s,i)=>s+(parseFloat(String(i.price).replace(/[^0-9.]/g,'')||0)*i.qty),0);
  document.getElementById('cartTotal').textContent=(sub+(sub?deliveryFee:0))+' ريال';
  document.getElementById('checkoutBtn').disabled=false;
}
function cartQty(cartId,c){const i=cart.find(x=>x.cartId===cartId);if(i){i.qty+=c;if(i.qty<1)cart=cart.filter(x=>x.cartId!==cartId);updateCart();renderCart()}}

// ==================== Auth ====================
function toggleAuth(){document.getElementById('authModal').classList.toggle('open')}
async function doAuth(){
  const name=document.getElementById('authName').value.trim(),phone=document.getElementById('authPhone').value.trim();
  const pass=document.getElementById('authPass').value.trim();
  if(!name||!phone||!pass||pass.length<8){alert('املأ جميع الحقول (كلمة المرور 8 أحرف+)');return}
  try{
    // Check if user exists
    const r=await apiGet('users');const users=docs(r);
    const existing=users.filter(u=>u.name===name||u.phone===phone);
    if(existing.length){
      // Login
      const eu=existing[0];
      const hp=await _hash(pass);const hpl=await _hash(pass.toLowerCase());
      if(eu.password===hp||eu.password===hpl||eu.password===pass){user=eu;toast('مرحباً '+user.name);toggleAuth();return}
      alert('كلمة المرور غير صحيحة');return
    }
    // Register
    const hp=await _hash(pass);
    const nu={name,phone,password:hp,createdAt:new Date().toISOString()};
    await apiAdd('users',nu);
    user={name,phone};toast('تم التسجيل, مرحباً '+name);toggleAuth()
  }catch(e){alert('خطأ: '+e.message)}
}
async function _hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

// ==================== Checkout ====================
async function checkout(){
  if(!cart.length){toast('السلة فارغة',true);return}
  if(!user){toast('سجل دخولك أولاً',true);toggleCart();return}
  document.getElementById('checkoutModal').classList.add('open');
  const sub=cart.reduce((s,i)=>s+(parseFloat(String(i.price).replace(/[^0-9.]/g,'')||0)*i.qty),0);
  document.getElementById('coTotal').textContent=(sub+deliveryFee)+' ريال';
}
async function placeOrder(){
  const addr=document.getElementById('coAddress').value.trim();
  if(!addr){alert('أدخل العنوان');return}
  const notes=document.getElementById('coNotes').value.trim();
  const pm=document.querySelector('input[name="pm"]:checked')?.value||'cash';
  const sub=cart.reduce((s,i)=>s+(parseFloat(String(i.price).replace(/[^0-9.]/g,'')||0)*i.qty),0);
  try{
    await apiAdd('orders',{
      customerName:user.name,customerPhone:user.phone,address:addr,notes:notes||null,
      items:JSON.stringify(cart.map(i=>({name:i.name,price:i.price,qty:i.qty,option:i.selectedOption||null}))),
      total:sub+deliveryFee,subtotal:sub,deliveryFee,paymentMethod:pm,status:'pending',
      userId:user.id||null,createdAt:new Date().toISOString()
    });
    cart=[];updateCart();document.getElementById('checkoutModal').classList.remove('open');toggleCart();toast('تم إرسال الطلب ✅')
  }catch(e){alert('خطأ: '+e.message)}
}

// ================== Toast ====================
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'var(--danger)':'var(--card)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

</script>
</body></html>
