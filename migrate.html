<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="UTF-8"><title>هجرة البيانات</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:#0f172a; color:#fff; padding:20px; max-width:700px; margin:auto; }
h1 { text-align:center; color:#38bdf8; margin-bottom:20px; }
.card { background:#1e293b; padding:20px; border-radius:12px; margin-bottom:20px; }
label { display:block; color:#94a3b8; font-size:13px; margin-bottom:4px; }
input { width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:14px; margin-bottom:12px; }
button { width:100%; padding:14px; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; }
.btn-start { background:#22c55e; color:#fff; }
.btn-start:disabled { opacity:.5; cursor:not-allowed; }
.log { background:#0f172a; padding:12px; border-radius:8px; font-size:12px; color:#94a3b8; height:300px; overflow-y:auto; white-space:pre-wrap; }
.log .ok { color:#22c55e; }
.log .err { color:#ef4444; }
.log .info { color:#38bdf8; }
.progress { height:6px; background:#334155; border-radius:3px; margin:12px 0; overflow:hidden; }
.progress-bar { height:100%; background:#22c55e; width:0; transition:width .3s; }
</style>
</head>
<body>
<h1>🔄 هجرة البيانات</h1>
<div class="card">
  <p style="color:#94a3b8;margin-bottom:16px;">تنقل جميع البيانات من المشروع القديم إلى الجديد عبر Firestore SDK</p>
  <label>المشروع الجديد — Web API Key</label>
  <input id="newKey" value="AIzaSyBGM-ORvTV4juxPfiA8Mb7Vb25_0EQchEY">
  <label>المشروع الجديد — Project ID</label>
  <input id="newPid" value="wessam2">
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <button class="btn-start" id="startBtn" onclick="startMigration()">🚀 ابدأ الهجرة</button>
</div>
<div class="card"><div class="log" id="log">أنقر "ابدأ الهجرة" لبدء نقل البيانات...</div></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const LOG = document.getElementById('log');
const BAR = document.getElementById('bar');
const BTN = document.getElementById('startBtn');
function log(msg, type='info') {
    LOG.innerHTML += `<span class="${type}">${msg}</span>\n`;
    LOG.scrollTop = LOG.scrollHeight;
}
function setProgress(pct) { BAR.style.width = pct + '%'; }

// المشروع القديم config
const oldConfig = {
    apiKey: "AIzaSyA2N_lsZ7yyvT1kIydXFkW_fLVFH0kQRBk",
    authDomain: "wessam-8ac1d.firebaseapp.com",
    projectId: "wessam-8ac1d",
    storageBucket: "wessam-8ac1d.firebasestorage.app",
    messagingSenderId: "140878579052",
    appId: "1:140878579052:web:53a52b34a176171cf6df49"
};

const oldApp = firebase.initializeApp(oldConfig, 'old');
const oldDb = firebase.firestore(oldApp);

const newKeyEl = document.getElementById('newKey');
const newPidEl = document.getElementById('newPid');
const NEW_API_BASE = () => `https://firestore.googleapis.com/v1/projects/${newPidEl.value.trim()}/databases/(default)/documents`;

async function migrateCollection(name, label) {
    log(`📂 قراءة ${label}...`);
    let docs = [];
    try {
        const snap = await oldDb.collection(name).get();
        snap.forEach(d => docs.push({ id: d.id, data: d.data() }));
    } catch (e) {
        log(`❌ فشل قراءة ${label}: ${e.message}`, 'err');
        return 0;
    }
    log(`   → ${docs.length} مستند`, 'info');
    if (!docs.length) return 0;

    let written = 0;
    for (const d of docs) {
        try {
            // write via REST API
            const url = `${NEW_API_BASE()}/${name}?documentId=${encodeURIComponent(d.id)}&key=${newKeyEl.value.trim()}`;
            const fields = {};
            for (const [k, v] of Object.entries(d.data)) {
                if (v === null || v === undefined) fields[k] = { nullValue: null };
                else if (typeof v === 'string') fields[k] = { stringValue: v };
                else if (typeof v === 'boolean') fields[k] = { booleanValue: v };
                else if (typeof v === 'number') {
                    if (Number.isInteger(v)) fields[k] = { integerValue: String(v) };
                    else fields[k] = { doubleValue: v };
                } else if (typeof v === 'object' && v !== null && v.toDate) {
                    fields[k] = { timestampValue: v.toDate().toISOString() };
                } else if (v instanceof Date) {
                    fields[k] = { timestampValue: v.toISOString() };
                } else if (Array.isArray(v)) {
                    fields[k] = { arrayValue: { values: v.map(item => ({ stringValue: String(item) })) } };
                } else {
                    fields[k] = { stringValue: String(v) };
                }
            }
            const r = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ fields })
            });
            if (!r.ok) {
                const errData = await r.json().catch(()=>({}));
                throw new Error(errData.error?.message || r.statusText);
            }
            written++;
        } catch (e) {
            log(`   ⚠️ ${d.id}: ${e.message}`, 'err');
        }
        // تأخير بسيط عشان ما نضرب الحد
        if (written % 50 === 0) await new Promise(r => setTimeout(r, 1000));
    }
    log(`✅ ${label}: ${written}/${docs.length}`, written > 0 ? 'ok' : 'err');
    return written;
}

async function startMigration() {
    BTN.disabled = true;
    BTN.textContent = 'جاري الهجرة...';
    LOG.innerHTML = '';
    setProgress(0);

    const collections = [
        ['products', 'المنتجات'],
        ['deliveryBoys', 'الموصلين'],
        ['staff', 'المشرفين'],
        ['orders', 'الطلبات'],
        ['customCategories', 'الأقسام المخصصة'],
        ['settings', 'الإعدادات'],
        ['promoCodes', 'أكواد الخصم'],
        ['reviews', 'التقييمات'],
        ['users', 'المستخدمين'],
    ];

    let total = collections.length;
    let done = 0;
    let totalWritten = 0;

    for (const [name, label] of collections) {
        const w = await migrateCollection(name, label);
        totalWritten += w;
        done++;
        setProgress((done/total)*100);
    }

    log(`\n🎀 تم نقل ${totalWritten} مستند بنجاح!`, 'ok');
    log(`\nالآن: افتح صفحة الإدارة على المشروع الجديد وأضف بياناتك.`, 'info');
    BTN.textContent = '✅ تمت الهجرة';
}
</script>
</body>
</html>
